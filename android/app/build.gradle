plugins { id 'com.android.application'; id 'com.chaquo.python' }

chaquopy {
    defaultConfig {
        version = '3.11'
        extractPackages 'web', 'tools', 'patcher', 'archive', 'bunker_tools'
        pip {
            install 'fastapi==0.115.14'
            install 'pydantic==1.10.22'
            install 'uvicorn==0.34.3'
            install 'jinja2==3.1.6'
            install 'python-multipart==0.0.20'
            install 'pycryptodome==3.21.0'
            install '../vendor/wheels/msgpack-1.1.1-py3-none-any.whl'
            install 'lz4==4.3.2'
        }
    }
}

android {
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    namespace = 'org.veritr1x.bunker'
    compileSdk = 36
    defaultConfig {
        applicationId = 'org.veritr1x.bunker'
        minSdk = 28
        targetSdk = 36
        // Bunker's version (scripts/version.py), shown in About and the exported log.
        // The installed app keeps the game's own version, 3.7.1.
        def bunkerVersion = providers.exec { commandLine 'python3', "${rootDir}/../scripts/version.py" }.standardOutput.asText.get().trim()
        versionCode = 1
        versionName = bunkerVersion
        buildConfigField 'String', 'BUNKER_VERSION', "\"${bunkerVersion}\""
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner = 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig = true }
    packaging { jniLibs { useLegacyPackaging = false } }
    buildTypes { release { minifyEnabled = false } }
}
