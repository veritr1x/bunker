plugins { id 'com.android.application'; id 'com.chaquo.python' }

chaquopy {
    defaultConfig {
        version = '3.11'
        extractPackages 'web', 'tools', 'patcher', 'archive', 'bunker_tools'
        pip {
            install 'fastapi==0.115.14'
            install 'pydantic==1.10.22'
            install 'uvicorn==0.34.3'
            install 'jinja2==3.1.6'
            install 'python-multipart==0.0.20'
            install 'pycryptodome==3.21.0'
            install '../vendor/wheels/msgpack-1.1.1-py3-none-any.whl'
            install 'lz4==4.3.2'
        }
    }
}

android {
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    namespace = 'org.veritr1x.bunker'
    compileSdk = 36
    defaultConfig {
        applicationId = 'org.veritr1x.bunker'
        minSdk = 28
        targetSdk = 36
        // Bunker's version (scripts/version.py), shown in About and the exported log.
        // The installed app keeps the game's own version, 3.7.1.
        def bunkerVersion = providers.exec { commandLine 'python3', "${rootDir}/../scripts/version.py" }.standardOutput.asText.get().trim()
        versionCode = 1
        versionName = bunkerVersion
        buildConfigField 'String', 'BUNKER_VERSION', "\"${bunkerVersion}\""
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner = 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// Java is compiled with JDK 21 whichever JDK runs Gradle: the Android plugin builds its JDK image with the
// compiling JDK's jlink, and newer ones (26) refuse the SDK's java.base ("cannot find the build signature").
// Gradle finds an installed JDK 21, or downloads one (settings.gradle).
java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

android {
    buildFeatures { buildConfig = true }
    packaging { jniLibs { useLegacyPackaging = false } }
    buildTypes { release { minifyEnabled = false } }
}

// Bunker's own words in English (translations/bunker/en.json), packed as the asset lunar/bunker_en.json for the
// launcher (Texts.java). Pod Programs and the Archive read the same catalogue on the Python side.
def bunkerTextAssets = layout.buildDirectory.dir('generated/bunkerText/assets')
def bunkerText = tasks.register('bunkerText', Copy) {
    from("${rootDir}/../translations/bunker") { include 'en.json'; rename 'en.json', 'bunker_en.json' }
    into layout.buildDirectory.dir('generated/bunkerText/assets/lunar')  // the game APK keeps assets/lunar/
}
android.sourceSets.main.assets.srcDir(bunkerTextAssets.get().asFile)
preBuild.dependsOn bunkerText
