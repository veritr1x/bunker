{% extends "base.html" %}
{% import "schedule_macros.html" as s with context %}
{% block content %}
<p class="crumb"><a href="/">{{ t("archive.menu.archive") }}</a> › <a href="/schedule?tab=shops">{{ t("archive.schedule.shops") }}</a></p>
<h1>{{ item.name }}</h1>
<div class="panel">
  <article class="record"><h3>{{ item.kind }}</h3><p>{{ item.when.label }}</p></article>
  {{ s.lineup(item["items"]) }}
</div>
{% endblock %}
