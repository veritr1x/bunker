# Builds the in-browser builder on every push to main (a check only). The site
# is published when this runs by hand or from release.yml, which passes the
# release tag as "ref" (Pages deploys only from main, so the workflow runs on
# main and checks out the tag).
# Released mobile bundles and the versioned Windows kit are verified before publishing.
# The selected Windows release also serves the approved translated runtime. Players supply the APK and master data.
name: Web builder

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build the site from; empty builds the latest release (release.yml passes the release tag)"
        default: ""

permissions:
  contents: read

# Pushes cancel older push builds; a publish (by hand or from release.yml) is never cancelled by a push.
concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # The release's unit tests, on every push to main: a release should not be
  # the first to find a broken builder.
  tests:
    name: Unit tests
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            scripts/requirements-notices.txt
            scripts/requirements-web-tests.txt
      - run: python3 -m pip install pycryptodome msgpack lz4 fonttools==4.56.0 fastapi==0.115.14 jinja2==3.1.6 python-multipart==0.0.20 httpx==0.28.1 -r scripts/requirements-notices.txt -r scripts/requirements-web-tests.txt
      # Chromium for the Deck Builder page tests, kept by Playwright's pin.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/requirements-web-tests.txt') }}
      - run: python3 -m playwright install --with-deps --only-shell chromium
      # The web builder publishes Pod Programs' prepared patcher (scripts/prepare.py).
      - run: python3 scripts/prepare.py
      - name: Unit tests
        run: scripts/unit_tests.sh

  # What to build: a push builds what was pushed; a publish builds the given
  # ref, or the latest release, so a run by hand never publishes a +dev site.
  resolve:
    name: Choose the source
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      mobile_release: ${{ steps.ref.outputs.mobile_release }}
    steps:
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then ref="$GITHUB_REF"
          elif [ -n "$INPUT" ]; then ref="$INPUT"
          else ref="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"; fi
          echo "Building $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && gh release view "$ref" --repo "$GITHUB_REPOSITORY" --json assets |
            jq -e --arg v "${ref#v}" '[.assets[].name] as $names | ["bunker-android-\($v).zip","bunker-ios-framework-\($v).zip","bunker-ios-python-\($v).zip"] - $names | length == 0' >/dev/null; then
            echo "mobile_release=$ref" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android launcher
    needs: resolve
    if: needs.resolve.outputs.mobile_release == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ needs.resolve.outputs.ref }}
      # The toolchain action from this workflow's commit: a tag being built may predate it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github/actions
      - uses: ./.ci/.github/actions/toolchain
        with:
          java: "true"
          android: "true"
      - name: Prepare sources
        run: |
          python3.11 scripts/prepare.py
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          make -C server proto
      - name: Build the launcher APK
        run: |
          android/tools/build_native.sh
          cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: android-launcher
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS launcher and Tools runtime
    needs: resolve
    if: needs.resolve.outputs.mobile_release == ''
    runs-on: macos-26  # Xcode 26 (the iOS 26 SDK); macos-15 defaults to Xcode 16.4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ needs.resolve.outputs.ref }}
      # The toolchain action from this workflow's commit: a tag being built may predate it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github/actions
      - uses: ./.ci/.github/actions/toolchain
        with:
          uv: "true"
          ios-cache: "true"
      - name: Prepare sources
        run: |
          python3.11 scripts/prepare.py
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          make -C server proto
          uv python install 3.13
      - name: Build the launcher framework and Python runtime
        run: |
          ios/tools/build_framework.sh none out
          python3.11 ios/tools/build_python.py out/python-bundle
      - uses: actions/upload-artifact@v7
        with:
          name: ios-bundles
          path: out

  site:
    name: Assemble the site
    if: |
      !cancelled() && github.event_name == 'workflow_dispatch' && needs.resolve.result == 'success' &&
      (needs.resolve.outputs.mobile_release != '' || (needs.android.result == 'success' && needs.ios.result == 'success'))
    needs: [resolve, android, ios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        if: needs.resolve.outputs.mobile_release == ''
        with:
          name: android-launcher
          path: bundles/android
      - uses: actions/download-artifact@v8
        if: needs.resolve.outputs.mobile_release == ''
        with:
          name: ios-bundles
          path: bundles/ios
      - name: Reuse the verified Android and iOS release bundles
        if: needs.resolve.outputs.mobile_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.mobile_release }}
        run: |
          v=${TAG#v}
          mkdir -p bundles/android bundles/ios/python-bundle
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/mobile-release.json"
          for name in "bunker-android-$v.zip" "bunker-ios-framework-$v.zip" "bunker-ios-python-$v.zip"; do
            gh release download "$TAG" --pattern "$name" --dir bundles
            digest=$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .digest | select(startswith("sha256:"))' "$RUNNER_TEMP/mobile-release.json")
            echo "${digest#sha256:}  bundles/$name" | sha256sum --check
          done
          mv "bundles/bunker-android-$v.zip" bundles/android/app-debug.apk
          unzip -qo "bundles/bunker-ios-framework-$v.zip" -d bundles/ios
          unzip -qo "bundles/bunker-ios-python-$v.zip" -d bundles/ios/python-bundle
      # A mobile release tag can predate the matching Windows browser publisher.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .publisher
          sparse-checkout: web
          persist-credentials: false
      - name: Select the tested Windows release
        id: windows
        run: |
          lock=.publisher/web/windows-release.json
          if [[ "$(jq -r .bunkerVersion "$lock")" == "$(cat VERSION)" ]]; then
            cp .publisher/web/{app.js,index.html,build_site.py,windows-worker.js} web/
            echo "revision=$(jq -er .runtimeRevision "$lock")" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch the approved translated runtime
        if: steps.windows.outputs.revision != ''
        uses: actions/checkout@v7
        with:
          repository: veritr1x/reincomp-private-archive
          ref: ${{ steps.windows.outputs.revision }}
          path: .build/windows-runtime
          ssh-key: ${{ secrets.WINDOWS_RUNTIME_DEPLOY_KEY }}
          persist-credentials: false
      # The master-data patcher the builders run is Pod Programs' prepared copy.
      - run: python3.11 scripts/prepare.py
      # The notice pack is pinned by notices.lock.json and kept out of the repository.
      - uses: actions/cache@v6
        with:
          path: inputs/bunker-notices.zip
          key: notices-${{ hashFiles('notices.lock.json') }}
      - name: Build the site
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_REVISION: ${{ steps.windows.outputs.revision }}
        run: |
          version=$(cat VERSION)
          asset="bunker-windows-browser-$version.zip"
          windows=()
          digest=""
          if [[ -n "$WINDOWS_REVISION" ]]; then
            lock=.publisher/web/windows-release.json
            echo "$(jq -er .runtimeManifestSHA256 "$lock")  .build/windows-runtime/runtime.json" | sha256sum --check
            asset=$(jq -er .kitAsset "$lock")
            digest=$(jq -er .kitArchiveSHA256 "$lock")
            windows+=(--windows-runtime .build/windows-runtime)
          elif [[ -f web/windows-worker.js ]]; then
            digest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -r --arg tag "v$version" --arg name "$asset" '.[] | select(.tag_name == $tag) | .assets[] | select(.name == $name) | .digest | ltrimstr("sha256:")')
          fi
          if [[ -n "$digest" ]]; then
            gh release download "v$version" --pattern "$asset" --output bundles/windows-kit.zip
            echo "$digest  bundles/windows-kit.zip" | sha256sum --check
            mkdir -p .build/windows-kit
            unzip -qo bundles/windows-kit.zip -d .build/windows-kit
            windows+=(--windows-kit .build/windows-kit)
          fi
          notices=()
          if [ -f notices.lock.json ]; then python3 scripts/notices.py; notices=(--notices inputs/bunker-notices.zip); fi
          python3 web/build_site.py \
            --companion-apk bundles/android/app-debug.apk \
            --framework bundles/ios/LunarTear.framework \
            --python bundles/ios/python-bundle \
            --output site "${notices[@]}" "${windows[@]}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish
    if: github.event_name == 'workflow_dispatch'
    needs: site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
