# Builds the in-browser builder on every push to main (a check only). The site
# is published when this runs by hand or from release.yml, which passes the
# release tag as "ref" (Pages deploys only from main, so the workflow runs on
# main and checks out the tag).
# The bundles are built from this repository only; no game files or master
# data are used or published. Players supply their own files in the browser.
name: Web builder

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build the site from; empty builds the latest release (release.yml passes the release tag)"
        default: ""

permissions:
  contents: read

# Pushes cancel older push builds; a publish (by hand or from release.yml) is never cancelled by a push.
concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # The release's unit tests, on every push to main: a release should not be
  # the first to find a broken builder.
  tests:
    name: Unit tests
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-notices.txt
      - run: python3 -m pip install pycryptodome msgpack lz4 fonttools==4.56.0 -r scripts/requirements-notices.txt
      # The web builder publishes Pod Programs' prepared patcher (scripts/prepare.py).
      - run: python3 scripts/prepare.py
      - run: |
          (cd scripts && python3 -m unittest test_version test_release_assets test_notices test_sync_notice_prices test_history_runs test_tower_floors test_audit_notices test_audit_summon_links test_build_remaining_summon_notices test_build_summon_notice_repair_pack test_native_notice_costume_bonus test_notice_event_bonuses test_notice_fidelity test_notice_icons test_notice_templates test_rich_notice_content test_game_text test_master_text test_export_translations test_language_packs test_check_translations test_make_noto_subsets)
          (cd android/tools && python3 -m unittest test_privacy test_update_apk test_build_info test_notice_pack test_master_patch test_assemble_stream test_client_days test_bunker_button test_game_regions test_bunker_language test_game_fonts test_info_icon_size)
          (cd ios/tools && python3 -m unittest test_ipa_stream test_sign_ipa)
          (cd web && python3 -m unittest test_build_site)

  # What to build: a push builds what was pushed; a publish builds the given
  # ref, or the latest release, so a run by hand never publishes a +dev site.
  resolve:
    name: Choose the source
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then ref="$GITHUB_REF"
          elif [ -n "$INPUT" ]; then ref="$INPUT"
          else ref="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"; fi
          echo "Building $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  android:
    name: Android launcher
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ needs.resolve.outputs.ref }}
      # The toolchain action from this workflow's commit: a tag being built may predate it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github/actions
      - uses: ./.ci/.github/actions/toolchain
        with:
          java: "true"
          android: "true"
      - name: Prepare sources
        run: |
          python3.11 scripts/prepare.py
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          make -C server proto
      - name: Build the launcher APK
        run: |
          android/tools/build_native.sh
          cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: android-launcher
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS launcher and Tools runtime
    needs: resolve
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ needs.resolve.outputs.ref }}
      # The toolchain action from this workflow's commit: a tag being built may predate it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github/actions
      - uses: ./.ci/.github/actions/toolchain
        with:
          uv: "true"
          ios-cache: "true"
      - name: Prepare sources
        run: |
          python3.11 scripts/prepare.py
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          make -C server proto
          uv python install 3.13
      - name: Build the launcher framework and Python runtime
        run: |
          ios/tools/build_framework.sh none out
          python3.11 ios/tools/build_python.py out/python-bundle
      - uses: actions/upload-artifact@v7
        with:
          name: ios-bundles
          path: out

  site:
    name: Assemble the site
    if: github.event_name == 'workflow_dispatch'
    needs: [resolve, android, ios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: android-launcher
          path: bundles/android
      - uses: actions/download-artifact@v8
        with:
          name: ios-bundles
          path: bundles/ios
      # The master-data patcher the builders run is Pod Programs' prepared copy.
      - run: python3.11 scripts/prepare.py
      # The notice pack is pinned by notices.lock.json and kept out of the repository.
      - uses: actions/cache@v6
        with:
          path: inputs/bunker-notices.zip
          key: notices-${{ hashFiles('notices.lock.json') }}
      - name: Build the site
        run: |
          notices=()
          if [ -f notices.lock.json ]; then python3 scripts/notices.py; notices=(--notices inputs/bunker-notices.zip); fi
          python3 web/build_site.py \
            --companion-apk bundles/android/app-debug.apk \
            --framework bundles/ios/LunarTear.framework \
            --python bundles/ios/python-bundle \
            --output site "${notices[@]}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish
    if: github.event_name == 'workflow_dispatch'
    needs: site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
