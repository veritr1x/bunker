# Builds the in-browser builder on every push to main (a check only). The site
# is published when this runs by hand or from release.yml, which passes the
# release tag as "ref" (Pages deploys only from main, so the workflow runs on
# main and checks out the tag).
# The bundles are built from this repository only; no game files or master
# data are used or published. Players supply their own files in the browser.
name: Web builder

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build the site from; empty builds the latest release (release.yml passes the release tag)"
        default: ""

permissions:
  contents: read

# Pushes cancel older push builds; a publish (by hand or from release.yml) is never cancelled by a push.
concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # What to build: a push builds what was pushed; a publish builds the given
  # ref, or the latest release, so a run by hand never publishes a +dev site.
  resolve:
    name: Choose the source
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then ref="$GITHUB_REF"
          elif [ -n "$INPUT" ]; then ref="$INPUT"
          else ref="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"; fi
          echo "Building $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  android:
    name: Android launcher
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Android SDK components
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" > /dev/null
      - name: Prepare sources
        run: |
          python3.11 scripts/prepare.py
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          make -C server proto
      - name: Build the launcher APK
        run: |
          android/tools/build_native.sh
          cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-launcher
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS launcher and Tools runtime
    needs: resolve
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare sources
        run: |
          python3.11 scripts/prepare.py
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          make -C server proto
          uv python install 3.13
      - name: Build the launcher framework and Python runtime
        run: |
          ios/tools/build_framework.sh none out
          python3.11 ios/tools/build_python.py out/python-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ios-bundles
          path: out

  site:
    name: Assemble the site
    if: github.event_name == 'workflow_dispatch'
    needs: [resolve, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: android-launcher
          path: bundles/android
      - uses: actions/download-artifact@v4
        with:
          name: ios-bundles
          path: bundles/ios
      # The notice pack is pinned by notices.lock.json and kept out of the repository.
      - name: Build the site
        run: |
          notices=()
          if [ -f notices.lock.json ]; then python3 scripts/notices.py; notices=(--notices inputs/bunker-notices.zip); fi
          python3 web/build_site.py \
            --companion-apk bundles/android/app-debug.apk \
            --framework bundles/ios/LunarTear.framework \
            --python bundles/ios/python-bundle \
            --output site "${notices[@]}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish
    if: github.event_name == 'workflow_dispatch'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
