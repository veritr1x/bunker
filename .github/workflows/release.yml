# Builds a release from a v<VERSION> tag: checks the tag, builds Bunker's
# bundles, creates the GitHub Release (notes from CHANGELOG.md; bundles and
# update.json for the launcher's self-update), then has pages.yml publish the
# web builder from the tag.
# No game files or master data are built, attached or published.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Tag matches VERSION
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-notices.txt
      - run: python3 -m pip install pycryptodome msgpack lz4 fonttools==4.56.0 -r scripts/requirements-notices.txt
      # The web builder publishes Pod Programs' prepared patcher (scripts/prepare.py).
      - run: python3 scripts/prepare.py
      - name: Unit tests
        run: |
          (cd scripts && python3 -m unittest test_version test_release_assets test_notices test_sync_notice_prices test_history_runs test_tower_floors test_audit_notices test_audit_summon_links test_build_remaining_summon_notices test_build_summon_notice_repair_pack test_native_notice_costume_bonus test_notice_event_bonuses test_notice_fidelity test_notice_icons test_notice_templates test_rich_notice_content test_game_text test_master_text test_export_translations test_language_packs test_check_translations test_make_noto_subsets)
          (cd android/tools && python3 -m unittest test_privacy test_update_apk test_build_info test_notice_pack test_master_patch test_assemble_stream test_client_days test_bunker_button test_game_regions test_bunker_language)
          (cd ios/tools && python3 -m unittest test_ipa_stream test_sign_ipa)
          (cd web && python3 -m unittest test_build_site)
          python3 -c "import sys; sys.path.insert(0, 'scripts'); import release_assets; release_assets.changelog_section(open('CHANGELOG.md').read(), open('VERSION').read().strip())"

  android:
    needs: check
    name: Android launcher
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/toolchain
        with:
          java: "true"
          android: "true"
      - name: Prepare sources
        run: |
          python3.11 scripts/prepare.py
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          make -C server proto
      - name: Build the launcher APK
        run: |
          android/tools/build_native.sh
          cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: android-launcher
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    needs: check
    name: iOS launcher and Tools runtime
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/toolchain
        with:
          uv: "true"
          ios-cache: "true"
      - name: Prepare sources
        run: |
          python3.11 scripts/prepare.py
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          make -C server proto
          uv python install 3.13
      - name: iOS packaging tests
        # These build tiny iOS executables with Xcode, so they run on macOS.
        run: (cd ios/tools && python3.11 -m unittest test_package_ipa test_ios_update test_ipa_stream test_sign_ipa)
      - name: Build the launcher framework and Python runtime
        run: |
          ios/tools/build_framework.sh none out
          python3.11 ios/tools/build_python.py out/python-bundle
      - uses: actions/upload-artifact@v7
        with:
          name: ios-bundles
          path: out

  windows:
    needs: check
    name: Windows launcher
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.8"
          cache-dependency-path: windows/go.sum
      # Bunker.exe holds none of the Android SDK: it downloads the emulator from Google on first start.
      - name: Test and build Bunker.exe
        run: |
          cd windows
          go test ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=$(cat ../VERSION)" -o "../out/Bunker-$(cat ../VERSION).exe" .
          # Linux: Waydroid when it is installed, else Google's emulator.
          for arch in amd64:x86_64 arm64:arm64; do
            GOOS=linux GOARCH=${arch%%:*} CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$(cat ../VERSION)" -o "../out/Bunker-$(cat ../VERSION)-linux-${arch##*:}" .
          done
      - uses: actions/upload-artifact@v7
        with:
          name: windows-launcher
          path: out

  release:
    name: GitHub Release
    needs: [android, ios, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: android-launcher
          path: bundles/android
      - uses: actions/download-artifact@v8
        with:
          name: ios-bundles
          path: bundles/ios
      - uses: actions/download-artifact@v8
        with:
          name: windows-launcher
          path: dist
      - uses: actions/cache@v6
        with:
          path: inputs/bunker-notices.zip
          key: notices-${{ hashFiles('notices.lock.json') }}
      - name: Bundles, notice pack, update.json and notes
        run: |
          notices=()
          if [ -f notices.lock.json ]; then python3 scripts/notices.py; notices=(--notices inputs/bunker-notices.zip); fi
          python3 scripts/release_assets.py --version "$(cat VERSION)" \
            --companion-apk bundles/android/app-debug.apk \
            --framework bundles/ios/LunarTear.framework \
            --python bundles/ios/python-bundle \
            --out dist "${notices[@]}"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.exe dist/Bunker-*-linux-* dist/update.json --title "Bunker $(cat VERSION)" --notes-file dist/notes.md --verify-tag

  publish:
    name: Publish the web builder
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      # GitHub Pages deploys only from main, so pages.yml runs on main and builds the site from this tag.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$GITHUB_REF_NAME"
