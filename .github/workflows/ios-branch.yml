# Builds the iOS launcher framework and Python runtime from a branch, so a
# change to the iOS launcher can be packaged and tried on a device before a
# release (the framework needs Xcode). Nothing is published: the bundles are
# a workflow artifact only, for scripts/build.py-style packaging with the
# player's own game IPA.
name: iOS branch build

on:
  push:
    branches-ignore: [main]
    paths:
      - "ios/**"
      - "overlays/**"
      - "patches/**"
      - "android/app/src/main/python/**"
      - ".github/workflows/ios-branch.yml"
      - ".github/actions/**"
  workflow_dispatch:

concurrency:
  group: ios-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS launcher and Tools runtime
    runs-on: macos-26  # Xcode 26 (the iOS 26 SDK); macos-15 defaults to Xcode 16.4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/toolchain
        with:
          uv: "true"
          ios-cache: "true"
      - name: Prepare sources
        run: |
          python3.11 scripts/prepare.py
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          make -C server proto
          uv python install 3.13
      - name: Build the launcher framework and Python runtime
        run: |
          ios/tools/build_framework.sh none out
          python3.11 ios/tools/build_python.py out/python-bundle
      - uses: actions/upload-artifact@v7
        with:
          name: ios-bundles
          path: out
          retention-days: 7
